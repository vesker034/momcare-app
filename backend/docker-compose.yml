services:
  postgres:
    image: postgres:16-alpine
    container_name: momcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: momcare_db
      POSTGRES_USER: momcare
      POSTGRES_PASSWORD: momcare_password
    ports:
      - "5432:5432"
    volumes:
      - momcare_postgres_data:/var/lib/postgresql/data

volumes:
  momcare_postgres_data:
